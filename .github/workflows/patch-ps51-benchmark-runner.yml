name: Patch PowerShell 5.1 benchmark runner

on:
  push:
    branches:
      - feat/indexed-sample-benchmark

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/indexed-sample-benchmark
          fetch-depth: 0
      - name: Apply compatibility patch
        shell: pwsh
        run: python scripts/patch_ps51_benchmark_runner.py
      - name: Parse benchmark scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $files = @(
            'scripts/run-v0.2-benchmark-gate.ps1',
            'scripts/run-indexed-sample-benchmark.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $file).Path,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              exit 1
            }
          }
          if (Select-String -Path 'scripts/run-v0.2-benchmark-gate.ps1' -Pattern '\.ArgumentList' -Quiet) {
            throw 'ProcessStartInfo.ArgumentList is not PowerShell 5.1 compatible.'
          }
      - name: Commit compatibility fix
        shell: pwsh
        run: |
          Remove-Item scripts/patch_ps51_benchmark_runner.py -Force
          Remove-Item .github/workflows/patch-ps51-benchmark-runner.yml -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: support benchmark runner on Windows PowerShell 5.1"
          git push origin HEAD:feat/indexed-sample-benchmark
