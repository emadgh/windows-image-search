name: Patch face-search UI

on:
  push:
    branches:
      - feat/face-search-completion

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/face-search-completion
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply deterministic patch
        shell: pwsh
        run: python scripts/patch_face_search_ui.py

      - name: Format Rust
        shell: pwsh
        run: cargo fmt --all

      - name: Remove temporary patch machinery
        shell: pwsh
        run: |
          Remove-Item scripts/patch_face_search_ui.py
          Remove-Item .github/workflows/patch-face-search-ui.yml
          Remove-Item .patch-face-search-trigger -ErrorAction SilentlyContinue

      - name: Commit patched sources
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "feat: wire searchable face gallery into GUI"
          git push origin HEAD:feat/face-search-completion
