name: Self patch portable repair

on:
  push:
    branches:
      - fix/portable-derived-cache-repair

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/portable-derived-cache-repair
      - name: Fix HNSW loader lifetime
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/bin/portable-cache-repair.rs')
          text = path.read_text(encoding='utf-8')
          old = '''    let mut loader = HnswIo::new(&ann_dir, &manifest.basename);\n    match loader.load_hnsw::<f32, DistCosine>() {\n        Ok(_) => Ok(AnnState::Current),\n        Err(_) => Ok(AnnState::Corrupt),\n    }\n'''
          new = '''    let mut loader = HnswIo::new(&ann_dir, &manifest.basename);\n    let state = match loader.load_hnsw::<f32, DistCosine>() {\n        Ok(_) => AnnState::Current,\n        Err(_) => AnnState::Corrupt,\n    };\n    Ok(state)\n'''
          if old not in text:
              raise SystemExit('expected HNSW loader block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bin/portable-cache-repair.rs
          git rm .github/workflows/self-patch-portable.yml
          git commit -m "fix: avoid borrowed HNSW loader temporary"
          git push origin HEAD:fix/portable-derived-cache-repair
