name: Apply visible-order cache compile fix

on:
  push:
    branches: [perf/cache-visible-result-order]
    paths:
      - '.github/workflows/apply-visible-order-cache.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/cache-visible-result-order
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply compile fix
        run: python scripts/apply_visible_order_cache.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Commit optimization
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ui/mod.rs
          git commit -m 'fix(ui): derive Debug for cached sort mode'
          git push origin HEAD:perf/cache-visible-result-order
