name: Format v0.2.1 source

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format-source:
    if: github.head_ref == 'perf/ann-benchmark-v0.2.1'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/ann-benchmark-v0.2.1
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and commit
        shell: pwsh
        run: |
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src\ann.rs src\main.rs
          if (git status --porcelain -- src\ann.rs src\main.rs) {
            git commit -m "chore: rustfmt v0.2.1 benchmark source"
            git push origin HEAD:perf/ann-benchmark-v0.2.1
          }
