name: Apply automatic updater integration

on:
  push:
    branches:
      - feat/automatic-github-updates

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/automatic-github-updates
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply integration
        shell: bash
        run: |
          python scripts/apply_auto_updater.py
          python - <<'PY'
          from pathlib import Path
          p = Path('src/ui/settings_window.rs')
          s = p.read_text()
          s = s.replace('UpdateStatus::Idle => ui.label("Not checked in this session."),', 'UpdateStatus::Idle => { ui.label("Not checked in this session."); }')
          s = s.replace('UpdateStatus::UpToDate => ui.label("✓ You are running the newest stable release."),', 'UpdateStatus::UpToDate => { ui.label("✓ You are running the newest stable release."); }')
          s = s.replace('UpdateStatus::Available(info) => ui.label(format!("Version {} is available.", info.version)),', 'UpdateStatus::Available(info) => { ui.label(format!("Version {} is available.", info.version)); }')
          s = s.replace('let checking = matches!(status, UpdateStatus::Checking | UpdateStatus::Downloading { .. });', 'let checking = matches!(&status, UpdateStatus::Checking | UpdateStatus::Downloading { .. });')
          s = s.replace('if matches!(status, UpdateStatus::Available(_)) && ui.button("Download now").clicked()', 'if matches!(&status, UpdateStatus::Available(_)) && ui.button("Download now").clicked()')
          s = s.replace('if matches!(status, UpdateStatus::Ready(_, _)) {', 'if matches!(&status, UpdateStatus::Ready(_, _)) {')
          p.write_text(s)
          PY
          cargo fmt --all
          cargo generate-lockfile
          rm scripts/apply_auto_updater.py
          rm .github/workflows/apply-auto-updater.yml
      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add automatic GitHub updates"
          git push origin HEAD:feat/automatic-github-updates
