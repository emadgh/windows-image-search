name: Integrate updater with UI overhaul

on:
  push:
    branches: [integration/updater-on-ui-overhaul]
    paths:
      - '.github/workflows/integrate-updater-ui-overhaul.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/updater-on-ui-overhaul
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Merge updater branch and resolve UI conflicts
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin feat/automatic-github-updates
          set +e
          git merge --no-commit --no-ff origin/feat/automatic-github-updates
          merge_status=$?
          set -e
          conflicts="$(git diff --name-only --diff-filter=U | sort)"
          expected=$'src/ui/mod.rs\nsrc/ui/settings_window.rs'
          if [ "$merge_status" -eq 0 ]; then
            echo 'Expected the known updater/UI conflicts, but merge completed without them.'
            exit 1
          fi
          if [ "$conflicts" != "$expected" ]; then
            echo 'Unexpected conflict set:'
            printf '%s\n' "$conflicts"
            exit 1
          fi
          git checkout --ours src/ui/mod.rs src/ui/settings_window.rs
          python scripts/resolve-updater-ui-overhaul.py
          git add -A
          unresolved="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unresolved" ]; then
            echo 'Unresolved merge files remain:'
            printf '%s\n' "$unresolved"
            exit 1
          fi
      - name: Format Rust
        run: cargo fmt --all
      - name: Commit resolved integration
        shell: bash
        run: |
          git add -A
          git commit -m 'merge(ui): resolve updater against UI overhaul'
          git push origin HEAD:integration/updater-on-ui-overhaul
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Cargo check
        run: cargo check --all-targets
      - name: Tests
        run: cargo test --all-targets
      - name: Release build
        run: cargo build --release
      - name: Clean integration helpers and fast-forward updater PR
        shell: bash
        run: |
          git rm .github/workflows/integrate-updater-ui-overhaul.yml scripts/resolve-updater-ui-overhaul.py
          git commit -m 'chore: remove updater integration helpers'
          git push origin HEAD:integration/updater-on-ui-overhaul
          git push origin HEAD:feat/automatic-github-updates
