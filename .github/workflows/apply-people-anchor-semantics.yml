name: Apply People anchor semantics

on:
  push:
    branches:
      - feat/people-management-overrides

permissions:
  contents: write

jobs:
  apply:
    # Temporary source patch job; removed by the job after a successful apply.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/people-management-overrides
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply patch
        run: python scripts/patch_people_anchor_semantics.py
      - name: Format
        run: cargo fmt --all
      - name: Remove temporary patch files
        run: |
          rm scripts/patch_people_anchor_semantics.py
          rm .github/workflows/apply-people-anchor-semantics.yml
      - name: Commit source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/people_overrides.rs src/people_effective.rs scripts/patch_people_anchor_semantics.py .github/workflows/apply-people-anchor-semantics.yml
          git commit -m "fix: separate explicit face assignments from cluster anchors"
          git push origin HEAD:feat/people-management-overrides
