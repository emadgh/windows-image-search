#[cfg(test)]
mod durability_tests {
    use super::*;
    use std::time::{SystemTime, UNIX_EPOCH};

    fn write_dummy(conn: &Connection, path: &Path, root: &Path) {
        upsert_image(
            conn,
            path,
            root,
            path.file_name().and_then(|name| name.to_str()).unwrap_or("image.jpg"),
            "jpg",
            123,
            456,
            64,
            64,
            "",
            "",
            [120, 90, 60],
            0xAA55_AA55_AA55_AA55,
            &[1.0, 0.0, 0.0, 0.0],
        )
        .unwrap();
    }

    #[test]
    fn committed_batch_survives_later_rollback() {
        let nonce = SystemTime::now()
            .duration_since(UNIX_EPOCH)
            .unwrap()
            .as_nanos();
        let db_path = std::env::temp_dir().join(format!(
            "windows-image-search-durability-{}-{nonce}.sqlite3",
            std::process::id()
        ));
        let root = PathBuf::from("C:/indexed");
        let first = root.join("first.jpg");
        let second = root.join("second.jpg");

        {
            let mut conn = open(&db_path).unwrap();
            {
                let tx = conn.transaction().unwrap();
                write_dummy(&tx, &first, &root);
                tx.commit().unwrap();
            }
            {
                let tx = conn.transaction().unwrap();
                write_dummy(&tx, &second, &root);
                // Simulate an interrupted batch: dropping an uncommitted transaction rolls it back.
            }
        }

        let records = load_images(&db_path).unwrap();
        assert_eq!(records.len(), 1);
        assert_eq!(records[0].path, first);

        let _ = std::fs::remove_file(&db_path);
        let _ = std::fs::remove_file(db_path.with_extension("sqlite3-wal"));
        let _ = std::fs::remove_file(db_path.with_extension("sqlite3-shm"));
    }
}
