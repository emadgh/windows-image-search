name: Apply durable live indexing implementation

on:
  push:
    branches: [fix/durable-live-indexing]
    paths:
      - .github/workflows/apply-durable-live-indexing.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/durable-live-indexing
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply source changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          # ---------------- indexer.rs ----------------
          path = Path("src/indexer.rs")
          text = path.read_text(encoding="utf-8")

