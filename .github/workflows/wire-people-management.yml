name: Wire People management core

on:
  push:
    branches:
      - feat/people-management-overrides

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/people-management-overrides
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Wire module
        run: python scripts/wire_people_management.py
      - name: Format
        run: cargo fmt --all
      - name: Remove temporary wiring files
        run: |
          rm scripts/wire_people_management.py
          rm .github/workflows/wire-people-management.yml
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.rs scripts/wire_people_management.py .github/workflows/wire-people-management.yml
          git commit -m "feat: wire People management core into application"
          git push origin HEAD:feat/people-management-overrides
