name: Wire People clustering module

on:
  push:
    branches:
      - feat/people-clustering-foundation

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/people-clustering-foundation
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Wire and format
        shell: pwsh
        run: |
          $path = 'src/main.rs'
          $text = Get-Content $path -Raw
          if ($text -notmatch '(?m)^mod people_clustering;$') {
            $text = $text -replace 'mod people_store;\r?\n', "mod people_clustering;`nmod people_store;`n"
            Set-Content -Path $path -Value $text -NoNewline
          }
          cargo fmt --all
      - name: Clean and commit
        shell: pwsh
        run: |
          Remove-Item .github/workflows/wire-people-clustering.yml
          if (Test-Path .wire-people-clustering-trigger) { Remove-Item .wire-people-clustering-trigger }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "feat: wire People clustering engine"
          git push origin HEAD:feat/people-clustering-foundation
