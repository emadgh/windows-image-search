name: Fix inline face empty refresh

on:
  push:
    branches:
      - feat/ui-ux-overhaul-phase-1
    paths:
      - scripts/fix_inline_face_empty_refresh.py
      - .github/workflows/fix-inline-face-empty-refresh.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ui-ux-overhaul-phase-1
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply fix
        run: python scripts/fix_inline_face_empty_refresh.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/face_search_panel.rs
          git commit -m "fix(ui): avoid repeated empty face refresh"
          git push origin HEAD:feat/ui-ux-overhaul-phase-1
