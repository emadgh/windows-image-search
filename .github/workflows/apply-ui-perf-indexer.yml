name: Apply UI performance indexer patch

on:
  push:
    branches: [feat/ui-performance-overhaul]
    paths:
      - .github/workflows/apply-ui-perf-indexer.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ui-performance-overhaul

      - name: Apply patch
        run: python scripts/apply_ui_perf_indexer.py

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format
        run: cargo fmt --all

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src Cargo.toml
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "perf: parallelize image preparation and preserve UI responsiveness"
          git push origin HEAD:feat/ui-performance-overhaul
