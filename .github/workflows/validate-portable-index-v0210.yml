name: Validate portable root index v0.2.10

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'feat/portable-root-index-v0.2.10'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/portable-root-index-v0.2.10
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Apply portable-index integration
        run: |
          python scripts/apply_portable_index_v0210.py
          python scripts/apply_portable_durability_v0210.py
          python scripts/apply_portable_final_v0210.py

      - name: Format
        run: cargo fmt --all

      - name: Cargo check
        run: cargo check --all-targets

      - name: Future-incompatible warnings are errors
        shell: pwsh
        run: |
          $env:RUSTFLAGS = '-Dfuture-incompatible'
          cargo check --all-targets

      - name: Regression tests
        run: cargo test --all-targets

      - name: Commit validated source and lockfile
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock src\main.rs src\db.rs src\fs_watch.rs src\indexer.rs src\ui\mod.rs src\portable.rs src\ann.rs src\thumbnail_cache.rs
          if (git status --porcelain -- Cargo.toml Cargo.lock src\main.rs src\db.rs src\fs_watch.rs src\indexer.rs src\ui\mod.rs src\portable.rs src\ann.rs src\thumbnail_cache.rs) {
            git commit -m "feat: finalize portable root index integration"
            git push origin HEAD:feat/portable-root-index-v0.2.10
          }
