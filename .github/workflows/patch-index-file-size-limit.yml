name: Patch index file size limit

on:
  push:
    branches:
      - feat/index-file-size-limit

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/patch_index_file_size_limit.py
      - name: Format
        run: cargo fmt --all
      - name: Commit patched sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/indexer.rs src/ui/mod.rs
          if git diff --cached --quiet; then
            echo "No source changes"
            exit 0
          fi
          git commit -m "feat: skip oversized source files before indexing"
          git push origin HEAD:feat/index-file-size-limit
