name: Wire People Manager UI

on:
  push:
    branches:
      - feat/people-management-overrides

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/people-management-overrides
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply UI wiring
        run: python scripts/wire_people_manager_ui.py
      - name: Format
        run: cargo fmt --all
      - name: Remove temporary wiring files
        run: |
          rm scripts/wire_people_manager_ui.py
          rm .github/workflows/wire-people-manager-ui.yml
      - name: Commit UI wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/face_search.rs src/ui/face_search_panel.rs src/ui/mod.rs src/ui/people_manager.rs scripts/wire_people_manager_ui.py .github/workflows/wire-people-manager-ui.yml
          git commit -m "feat: wire People Manager into the desktop UI"
          git push origin HEAD:feat/people-management-overrides
