name: Validate grouped Preferences

on:
  push:
    branches:
      - ui/grouped-preferences-window

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/grouped-preferences-window
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Cargo check
        run: cargo check --all-targets
      - name: Tests
        run: cargo test --all-targets
      - name: Release build
        run: cargo build --release
      - name: Remove temporary validator
        shell: bash
        run: rm .github/workflows/validate-grouped-preferences.yml
      - name: Commit validator cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/validate-grouped-preferences.yml
          git commit -m "chore: remove temporary Preferences validator"
          git push origin HEAD:ui/grouped-preferences-window
