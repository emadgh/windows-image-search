name: Apply oversized rescan call-site fix

on:
  push:
    branches:
      - fix/oversized-full-rescan-dispatch

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/oversized-full-rescan-dispatch
          fetch-depth: 0
      - name: Patch full rescan dispatcher
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/indexer.rs')
          source = path.read_text(encoding='utf-8')
          old = 'let result = inspect_image(&item.path, &item.root, item.size).map('
          new = 'let result = inspect_pending_image(item).map('
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one full-rescan direct inspection call, found {count}')
          path.write_text(source.replace(old, new), encoding='utf-8')
      - name: Commit focused fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-oversized-rescan-fix.yml
          git add src/indexer.rs
          git commit -m "fix: route full rescan through oversized preview dispatcher"
          git push origin HEAD:fix/oversized-full-rescan-dispatch
