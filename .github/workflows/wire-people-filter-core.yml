name: Wire and validate People filter core

on:
  push:
    branches:
      - feat/people-search-filters

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/people-search-filters
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Wire module
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/main.rs')
          text = path.read_text(encoding='utf-8')
          if 'mod people_filter;' not in text:
              anchor = 'mod people_effective;\n'
              if anchor not in text:
                  raise SystemExit('people_effective module anchor not found')
              text = text.replace(anchor, anchor + 'mod people_filter;\n', 1)
              path.write_text(text, encoding='utf-8')
          PY
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.rs src/people_filter.rs
          if ! git diff --cached --quiet; then
            git commit -m "feat: wire People filter core"
            git push origin HEAD:feat/people-search-filters
          fi

  validate:
    needs: wire
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/people-search-filters
          fetch-depth: 1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Cargo check
        run: cargo check --all-targets
      - name: Tests
        run: cargo test --all-targets

  cleanup:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/people-search-filters
          fetch-depth: 0
      - name: Remove temporary workflow
        run: |
          rm .github/workflows/wire-people-filter-core.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/wire-people-filter-core.yml
          git commit -m "chore: remove temporary People filter validator"
          git push origin HEAD:feat/people-search-filters
