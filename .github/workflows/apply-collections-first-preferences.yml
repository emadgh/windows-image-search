name: Apply Collections-first Preferences migration

on:
  push:
    branches:
      - feat/collections-first-preferences

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/collections-first-preferences
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Bring in validated grouped Preferences source
        shell: bash
        run: |
          git fetch origin ui/grouped-preferences-window:refs/remotes/origin/ui/grouped-preferences-window
          git show origin/ui/grouped-preferences-window:src/ui/settings_window.rs > src/ui/settings_window.rs
      - name: Apply Collections-first migration
        run: python scripts/apply_collections_first_preferences.py
      - name: Format source
        run: cargo fmt --all
      - name: Remove temporary patch machinery
        shell: bash
        run: |
          rm -f scripts/apply_collections_first_preferences.py
          rm -f .github/workflows/apply-collections-first-preferences.yml
      - name: Commit source only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/mod.rs src/ui/settings_window.rs src/ui/collections.rs
          git add -u scripts/apply_collections_first_preferences.py .github/workflows/apply-collections-first-preferences.yml || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: make Collections the library and indexing surface"
          git push origin HEAD:feat/collections-first-preferences
