name: Validate PR 215

on:
  push:
    branches: [perf/cache-visible-result-order]
    paths:
      - '.github/workflows/validate-pr215.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/cache-visible-result-order
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply similarity cache invalidation fix
        run: python scripts/fix-pr215-cache-regression.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Commit cache invalidation fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ui/mod.rs
          git commit -m 'fix(ui): invalidate cached order for new similarity results'
          git push origin HEAD:perf/cache-visible-result-order
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Cargo check
        run: cargo check --all-targets
      - name: Tests
        run: cargo test --all-targets
      - name: Release build
        run: cargo build --release
