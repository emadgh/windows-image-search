name: Format face search completion

on:
  push:
    branches:
      - feat/face-search-completion

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/face-search-completion
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - shell: pwsh
        run: cargo fmt --all
      - shell: pwsh
        run: |
          Remove-Item .github/workflows/format-face-search.yml
          if (Test-Path .format-face-search-trigger) { Remove-Item .format-face-search-trigger }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/face_search_panel.rs src/face_search.rs .github/workflows/format-face-search.yml .format-face-search-trigger
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "style: format face search completion"
          git push origin HEAD:feat/face-search-completion
