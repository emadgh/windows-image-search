name: Issue 225 finalization validation

on:
  push:
    branches: [chore/225-finalize-lock]
  workflow_dispatch:

permissions:
  contents: write

env:
  LIBVIPS_VERSION: 8.18.6

jobs:
  finalize:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/225-finalize-lock
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply finalization migration
        run: python scripts/apply-issue-225-finalize-lock.py
      - name: Refresh updater lock entry
        run: cargo update -p update-via-github
      - name: Format
        run: cargo fmt --all
      - name: Check locked configuration
        run: cargo check --all-targets --locked
      - name: Direct bounded decode regression
        run: cargo test --locked indexer::tests::direct_inspection_refuses_oversized_source_before_open
      - name: Verify updater revision
        shell: pwsh
        run: |
          $lock = Get-Content Cargo.lock -Raw
          if ($lock -notmatch 'update-via-github.git[^\r\n]*ec648957782ab800e14ddc6e0a15c694a46f1252') {
            throw 'Cargo.lock does not resolve the ZIP-aware updater revision.'
          }
      - name: Commit validated files
        shell: bash
        run: |
          if ! git diff --quiet -- Cargo.toml Cargo.lock src/indexer.rs; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.toml Cargo.lock src/indexer.rs
            git commit -m "Pin ZIP updater and align bounded preview regression"
            git push origin HEAD:chore/225-finalize-lock
          fi
