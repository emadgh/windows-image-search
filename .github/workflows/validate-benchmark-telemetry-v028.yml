name: Validate benchmark telemetry v0.2.8

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'perf/benchmark-telemetry-v0.2.8'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/benchmark-telemetry-v0.2.8
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: PowerShell benchmark runner syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $scriptPath = (Resolve-Path "scripts\run-v0.2-benchmark-gate.ps1").Path
          [System.Management.Automation.Language.Parser]::ParseFile(
            $scriptPath,
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_ -ForegroundColor Red }
            throw "Benchmark gate runner has PowerShell syntax errors"
          }

      - name: Format
        run: cargo fmt --all

      - name: Cargo check
        run: cargo check --all-targets

      - name: Future-incompatible warnings are errors
        env:
          RUSTFLAGS: -Dfuture-incompatible
        run: cargo check --all-targets

      - name: Regression tests
        run: cargo test --all-targets

      - name: Commit validated source and lockfile
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock Cargo.toml src\main.rs src\library_profile.rs scripts\run-v0.2-benchmark-gate.ps1 README.md
          if (git status --porcelain -- Cargo.lock Cargo.toml src\main.rs src\library_profile.rs scripts\run-v0.2-benchmark-gate.ps1 README.md) {
            git commit -m "perf: validate benchmark telemetry v0.2.8"
            git push origin HEAD:perf/benchmark-telemetry-v0.2.8
          }
