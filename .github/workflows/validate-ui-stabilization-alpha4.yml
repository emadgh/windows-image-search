name: Validate UI stabilization alpha4

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'fix/ui-indexing-stabilization-v0.3-alpha4'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ui-indexing-stabilization-v0.3-alpha4
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Normalize alpha4 patch context
        run: |
          python scripts/fix_ui_stabilization_patch_v2.py
          python scripts/fix_ui_stabilization_patch_v3.py

      - name: Apply alpha4 integration
        run: python scripts/apply_ui_stabilization_alpha4.py

      - name: Format
        run: cargo fmt --all

      - name: Cargo check
        run: cargo check --all-targets

      - name: Future-incompatible warnings are errors
        shell: pwsh
        run: |
          $env:RUSTFLAGS = '-Dfuture-incompatible'
          cargo check --all-targets

      - name: Regression tests
        run: cargo test --all-targets

      - name: Release build
        run: cargo build --release

      - name: Commit validated source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock src\main.rs src\db.rs src\indexer.rs src\thumbnail_cache.rs src\windows_shell.rs src\ui\mod.rs src\ui\collections.rs src\ui\views.rs
          if (git status --porcelain -- Cargo.toml Cargo.lock src\main.rs src\db.rs src\indexer.rs src\thumbnail_cache.rs src\windows_shell.rs src\ui\mod.rs src\ui\collections.rs src\ui\views.rs) {
            git commit -m "fix: stabilize indexing and Windows UI alpha4"
            git push origin HEAD:fix/ui-indexing-stabilization-v0.3-alpha4
          }
