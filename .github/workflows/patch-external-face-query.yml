name: Patch external face query

on:
  push:
    branches:
      - feat/face-search-completion

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/face-search-completion
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply patch
        shell: pwsh
        run: python scripts/patch_external_face_query.py
      - name: Format
        shell: pwsh
        run: cargo fmt --all
      - name: Remove temporary patch machinery
        shell: pwsh
        run: |
          Remove-Item scripts/patch_external_face_query.py
          Remove-Item .github/workflows/patch-external-face-query.yml
          Remove-Item .patch-external-face-query-trigger -ErrorAction SilentlyContinue
      - name: Commit patched sources
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "feat: add external multi-face query chooser"
          git push origin HEAD:feat/face-search-completion
