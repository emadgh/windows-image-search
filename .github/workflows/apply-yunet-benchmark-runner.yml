name: Apply YuNet benchmark runner integration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/yunet-face-benchmark-runner
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply CLI integration
        run: python scripts/apply_yunet_benchmark_runner.py
      - name: Format
        run: cargo fmt --all
      - name: Check and test
        run: |
          cargo check --all-targets
          cargo test --all-targets
      - name: Commit generated integration
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.rs src/face_yunet_benchmark.rs
          git commit -m "perf: wire YuNet detector benchmark CLI"
          git push origin HEAD:perf/yunet-face-benchmark-runner
