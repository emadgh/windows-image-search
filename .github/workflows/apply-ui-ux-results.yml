name: Apply results UX improvements

on:
  push:
    branches:
      - feat/ui-ux-overhaul-phase-1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ui-ux-overhaul-phase-1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply result UX integration
        run: |
          python scripts/apply_ui_ux_results.py
          cargo fmt --all
          git diff --check
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui
          git commit -m "feat(ui): improve result sorting loading and shortcuts"
          git push origin HEAD:feat/ui-ux-overhaul-phase-1
