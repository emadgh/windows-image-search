name: Apply managed face model integration

on:
  push:
    branches:
      - feat/auto-download-face-models
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/auto-download-face-models
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply integration
        run: python scripts/apply_managed_face_models.py
      - name: Format
        run: cargo fmt --all
      - name: Check and test
        run: |
          cargo check --all-targets
          cargo test --all-targets
      - name: Commit managed model source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock src/main.rs src/face_model_manager.rs src/ui/mod.rs src/ui/face_runtime.rs src/ui/settings_window.rs
          git commit -m "feat: auto-download verified YuNet and SFace models"
          git push origin HEAD:feat/auto-download-face-models
