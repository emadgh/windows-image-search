name: Validate CLIP device v0.2.5

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'feat/clip-device-v0.2.5'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/clip-device-v0.2.5
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Apply production wiring
        run: python scripts/apply_clip_device_v025.py

      - name: Format
        run: cargo fmt --all

      - name: Check
        run: cargo check --all-targets

      - name: Test
        run: cargo test --all-targets

      - name: Commit validated source and lockfile
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock Cargo.toml src\settings.rs src\embedding.rs src\indexer.rs src\ui\mod.rs
          if (git status --porcelain -- Cargo.lock Cargo.toml src\settings.rs src\embedding.rs src\indexer.rs src\ui\mod.rs) {
            git commit -m "feat: expose optional DirectML CLIP provider"
            git push origin HEAD:feat/clip-device-v0.2.5
          }
