name: Apply grouped Preferences refactor

on:
  push:
    branches:
      - ui/grouped-preferences-window

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/grouped-preferences-window
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply refactor
        run: python scripts/apply_grouped_preferences.py
      - name: Format
        run: cargo fmt --all
      - name: Remove temporary patch machinery
        run: |
          rm scripts/apply_grouped_preferences.py
          rm .github/workflows/apply-grouped-preferences.yml
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/mod.rs src/ui/settings_window.rs scripts/apply_grouped_preferences.py .github/workflows/apply-grouped-preferences.yml
          git commit -m "refactor: group Preferences settings by category"
          git push origin HEAD:ui/grouped-preferences-window
