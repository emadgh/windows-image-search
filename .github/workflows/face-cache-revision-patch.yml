name: Face cache revision patch

on:
  push:
    branches:
      - fix/face-cache-revisions

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/face-cache-revisions
          fetch-depth: 0

      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/fix_face_cache_patch_script.py
          python3 scripts/patch_face_cache_revisions.py
          cargo fmt --all

      - name: Commit patched sources
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/patch_face_cache_revisions.py
          rm -f scripts/fix_face_cache_patch_script.py
          rm -f .github/workflows/face-cache-revision-patch.yml
          rm -f face-cache-patch-failure.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: make face cache revisions content-aware"
          git push origin HEAD:fix/face-cache-revisions
