name: Apply UI UX batch 5

on:
  push:
    branches:
      - feat/ui-ux-overhaul-phase-1
    paths:
      - scripts/apply_ui_ux_batch5.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ui-ux-overhaul-phase-1
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply results toolbar polish
        run: python scripts/apply_ui_ux_batch5.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "feat(ui): polish result display and details sorting"
          git push origin HEAD:feat/ui-ux-overhaul-phase-1
