name: Validate face benchmark alpha3

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'perf/face-benchmark-eval-v0.3-alpha3'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/face-benchmark-eval-v0.3-alpha3
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Apply alpha3 integration
        run: python scripts/apply_face_benchmark_alpha3.py

      - name: Format
        run: cargo fmt --all

      - name: Cargo check
        run: cargo check --all-targets

      - name: Future-incompatible warnings are errors
        shell: pwsh
        run: |
          $env:RUSTFLAGS = '-Dfuture-incompatible'
          cargo check --all-targets

      - name: Regression tests
        run: cargo test --all-targets

      - name: CLI smoke validation
        shell: pwsh
        run: |
          $manifest = Join-Path $env:RUNNER_TEMP 'face-benchmark.tsv'
          @"
          model	smoke	1	cpu	MIT	true	true	bundled	ci-fixture
          image	zero.jpg
          image	person.jpg
          gt	person.jpg	0.1	0.1	0.3	0.3
          pred	person.jpg	0.95	0.1	0.1	0.3	0.3
          identity	q	p1	c1	p1	0.90
          identity	q	p1	c2	p2	0.10
          "@ | Set-Content -Path $manifest -Encoding utf8
          cargo run -- --validate-face-benchmark $manifest
          cargo run -- --benchmark-face $manifest

      - name: Commit validated source and lockfile
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock src\main.rs src\face_benchmark.rs docs\face-benchmark-manifest.md
          if (git status --porcelain -- Cargo.toml Cargo.lock src\main.rs src\face_benchmark.rs docs\face-benchmark-manifest.md) {
            git commit -m "feat: integrate face benchmark evaluator alpha3"
            git push origin HEAD:perf/face-benchmark-eval-v0.3-alpha3
          }
