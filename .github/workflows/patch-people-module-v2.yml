name: Wire People storage module v2

on:
  push:
    branches:
      - feat/people-clustering-foundation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/people-clustering-foundation
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Wire module
        shell: pwsh
        run: |
          $path = 'src/main.rs'
          $text = Get-Content $path -Raw
          if ($text -notmatch '(?m)^mod people_store;$') {
            $text = $text -replace 'mod portable_verify;\r?\n', "mod portable_verify;`nmod people_store;`n"
            Set-Content -Path $path -Value $text -NoNewline
          }
          cargo fmt --all
      - name: Remove temporary files and commit
        shell: pwsh
        run: |
          Remove-Item .github/workflows/patch-people-module-v2.yml
          if (Test-Path .patch-people-module-trigger) { Remove-Item .patch-people-module-trigger }
          if (Test-Path .patch-people-module-trigger-v2) { Remove-Item .patch-people-module-trigger-v2 }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "feat: wire People cluster storage"
          git push origin HEAD:feat/people-clustering-foundation
