name: Sync v0.2.1 source

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-source:
    if: github.head_ref == 'perf/ann-benchmark-v0.2.1'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/ann-benchmark-v0.2.1
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format, validate and sync generated source state
        shell: pwsh
        run: |
          cargo fmt --all
          cargo check --all-targets
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock src\ann.rs src\main.rs
          if (git status --porcelain -- Cargo.lock src\ann.rs src\main.rs) {
            git commit -m "chore: format benchmark source and sync v0.2.1 lock"
            git push origin HEAD:perf/ann-benchmark-v0.2.1
          }
