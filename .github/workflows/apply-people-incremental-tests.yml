name: Apply persisted People incremental regressions

on:
  push:
    branches:
      - feat/people-clustering-foundation

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/people-clustering-foundation
          fetch-depth: 0
      - name: Add persisted incremental regressions
        run: python scripts/add_people_incremental_regressions.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --all
      - name: Remove temporary patch machinery
        run: |
          rm scripts/add_people_incremental_regressions.py
          rm .github/workflows/apply-people-incremental-tests.yml
      - name: Commit tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/people_clustering.rs scripts/add_people_incremental_regressions.py .github/workflows/apply-people-incremental-tests.yml
          git commit -m "test: cover persisted People incremental updates"
          git push origin HEAD:feat/people-clustering-foundation
