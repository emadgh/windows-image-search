name: Setup v0.3.0 Face Roadmap

on:
  push:
    branches:
      - chore/setup-v0.3.0-face-roadmap

permissions:
  contents: read
  issues: write

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      MILESTONE_TITLE: v0.3.0 Face Search & People
    steps:
      - name: Create milestone and attach issues
        shell: bash
        run: |
          set -euo pipefail
          milestone_number="$(gh api "repos/${GITHUB_REPOSITORY}/milestones?state=all&per_page=100" --paginate --jq ".[] | select(.title == env.MILESTONE_TITLE) | .number" | head -n1)"
          if [ -z "$milestone_number" ]; then
            milestone_number="$(gh api -X POST "repos/${GITHUB_REPOSITORY}/milestones" \
              -f title="$MILESTONE_TITLE" \
              -f description="v0.3.0 roadmap for local face detection, face embeddings, face similarity search, People clustering/management, search integration, and Windows model/runtime benchmarking." \
              --jq '.number')"
          fi
          echo "Milestone #${milestone_number}: ${MILESTONE_TITLE}"
          for issue in 56 57 58 59 60 61 62; do
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/${issue}" -F milestone="$milestone_number" >/dev/null
            echo "Attached #${issue}"
          done
