name: Format People integration

on:
  push:
    branches:
      - feat/people-clustering-foundation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/people-clustering-foundation
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format source
        run: cargo fmt --all
      - name: Remove temporary formatter workflow
        run: rm .github/workflows/format-people-integration.yml
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/face_search.rs src/ui/face_runtime.rs src/ui/face_search_panel.rs .github/workflows/format-people-integration.yml
          git commit -m "style: format People runtime integration"
          git push origin HEAD:feat/people-clustering-foundation
