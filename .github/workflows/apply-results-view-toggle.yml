name: Apply results view toggle layout

on:
  push:
    branches: [feat/results-view-toggle-bar]
    paths:
      - .github/workflows/apply-results-view-toggle.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/results-view-toggle-bar

      - name: Apply patch
        run: python scripts/apply_results_view_toggle.py

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format
        run: cargo fmt --all

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/mod.rs
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "feat: move view controls into results header"
          git push origin HEAD:feat/results-view-toggle-bar
