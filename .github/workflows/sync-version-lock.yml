name: Sync version lock

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-lock:
    if: github.head_ref == 'chore/versioned-builds-v0.2.0'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/versioned-builds-v0.2.0
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Refresh Cargo.lock package version
        shell: pwsh
        run: |
          cargo check --all-targets
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          if (git status --porcelain -- Cargo.lock) {
            git commit -m "chore: sync Cargo.lock for v0.2.0"
            git push origin HEAD:chore/versioned-builds-v0.2.0
          }
