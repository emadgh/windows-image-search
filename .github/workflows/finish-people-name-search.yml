name: Finish People name search integration

on:
  push:
    branches:
      - feat/people-search-filters

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/people-search-filters
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply integration
        run: python scripts/finish_people_name_search.py
      - name: Format
        run: cargo fmt --all
      - name: Check core before commit
        run: cargo check --all-targets
      - name: Remove temporary integration machinery
        run: |
          rm scripts/finish_people_name_search.py
          rm .github/workflows/finish-people-name-search.yml
      - name: Commit final source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: search named People across Face Search and text search"
          git push origin HEAD:feat/people-search-filters
