name: Validate updater UI-overhaul compatibility

on:
  push:
    branches: [feat/automatic-github-updates-ui-overhaul]
    paths:
      - '.github/workflows/validate-updater-ui-overhaul.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/automatic-github-updates-ui-overhaul
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply final integration fixes
        run: python scripts/apply-updater-ui-overhaul.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Cargo check
        run: cargo check --all-targets
      - name: Tests
        run: cargo test --all-targets
      - name: Release build
        run: cargo build --release
      - name: Commit final integrated updater source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock src/main.rs src/update.rs src/ui/mod.rs src/ui/settings_window.rs src/ui/update_ui.rs
          if git diff --cached --quiet; then
            echo 'Updater integration source already current.'
            exit 0
          fi
          git commit -m 'fix(update): finalize UI-overhaul integration'
          git push origin HEAD:feat/automatic-github-updates-ui-overhaul
