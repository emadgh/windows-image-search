name: Validate indexing pause progress discovery

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'fix/indexing-pause-progress-discovery-v0.3'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/indexing-pause-progress-discovery-v0.3
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Apply regression fix
        run: python scripts/apply_indexing_pause_progress_discovery_fix.py

      - name: Format
        run: cargo fmt --all

      - name: Cargo check
        run: cargo check --all-targets

      - name: Future-incompatible warnings are errors
        shell: pwsh
        run: |
          $env:RUSTFLAGS = '-Dfuture-incompatible'
          cargo check --all-targets

      - name: Regression tests
        run: cargo test --all-targets

      - name: Release build
        run: cargo build --release

      - name: Commit validated source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src\db.rs src\indexer.rs src\ui\mod.rs
          if (git status --porcelain -- src\db.rs src\indexer.rs src\ui\mod.rs) {
            git commit -m "fix: pause indexing and refresh live progress counts"
            git push origin HEAD:fix/indexing-pause-progress-discovery-v0.3
          }
