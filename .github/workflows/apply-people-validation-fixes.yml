name: Apply People validation fixes

on:
  push:
    branches:
      - feat/people-management-overrides

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/people-management-overrides
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply validation feedback patch
        run: python scripts/apply_people_validation_fixes.py
      - name: Format
        run: cargo fmt --all
      - name: Check
        run: cargo check --all-targets
      - name: Remove temporary patch machinery
        shell: bash
        run: |
          rm -f scripts/apply_people_validation_fixes.py
          rm -f .github/workflows/apply-people-validation-fixes.yml
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: stabilize People UI after Windows validation"
          git push origin HEAD:feat/people-management-overrides
