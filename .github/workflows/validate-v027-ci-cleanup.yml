name: Validate v0.2.7 CI cleanup

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'chore/v027-ci-cleanup'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/v027-ci-cleanup
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Apply warning cleanup
        run: python scripts/apply_v027_ci_cleanup.py

      - name: Format
        run: cargo fmt --all

      - name: Cargo check
        run: cargo check --all-targets

      - name: Future-incompatible warnings are errors
        shell: pwsh
        run: |
          $env:RUSTFLAGS = "-Dfuture-incompatible"
          cargo check --all-targets

      - name: Regression tests
        run: cargo test --all-targets

      - name: Commit validated source and lockfile
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock src\db.rs src\indexer.rs src\model_benchmark.rs src\ui\collections.rs src\ui\mod.rs src\ui\views.rs
          if (git status --porcelain -- Cargo.toml Cargo.lock src) {
            git commit -m "chore: clean Rust warnings for v0.2.7"
            git push origin HEAD:chore/v027-ci-cleanup
          }
