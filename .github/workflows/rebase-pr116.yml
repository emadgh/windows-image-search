              if anchor not in text:
                  raise SystemExit('ann signature test anchor not found')
              text = text.replace(anchor, test + anchor, 1)

          path.write_text(text, encoding='utf-8')
          PY
          git add -A
          if git ls-files -u | grep -q .; then
            git status --short
            exit 1
          fi
          git rm .github/workflows/rebase-pr116.yml
          git commit -m "chore: merge main into indexing UX fix"
          git push origin HEAD:fix/indexing-pause-progress-discovery-v0.3
