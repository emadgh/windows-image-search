name: Windows build

on:
  push:
    branches:
      - main
      - feat/v0.1.0-mvp
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: PowerShell benchmark script syntax
        shell: pwsh
        run: |
          $files = @(
            'scripts/new-material-eval-manifest-from-folders.ps1',
            'scripts/run-v0.2-benchmark-gate-from-folders.ps1',
            'scripts/run-v0.2-benchmark-gate.ps1',
            'scripts/run-indexed-sample-benchmark.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $file).Path,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$file: $($_.Message)" }
              exit 1
            }
          }
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Cargo check
        run: cargo check --all-targets
      - name: Tests
        run: cargo test --all-targets
      - name: Release build
        run: cargo build --release
