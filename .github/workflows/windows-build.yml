name: Windows build

on:
  push:
    branches:
      - main
      - feat/v0.1.0-mvp
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sface-production-integration

      - name: Wire SFace production integration
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f"Missing patch anchor: {label}")
              return text.replace(old, new, 1)

          main = Path("src/main.rs")
          text = main.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "mod face_scope;\nmod face_sface_adapter;",
              "mod face_scope;\nmod face_settings;\nmod face_sface_adapter;\nmod face_sface_production;",
              "main modules",
          )
          main.write_text(text, encoding="utf-8")

          ui = Path("src/ui/mod.rs")
          text = ui.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "use crate::embedding::EmbeddingService;\nuse crate::fs_watch::{FsWatchMessage, FsWatchService};",
              "use crate::embedding::EmbeddingService;\nuse crate::face_settings::{self, FaceEmbeddingSettings};\nuse crate::face_sface_adapter::SFaceExecutionProvider;\nuse crate::fs_watch::{FsWatchMessage, FsWatchService};",
              "ui imports",
          )
          text = replace_once(
              text,
              "    pub(super) indexing_settings: IndexingSettings,\n    settings_path: PathBuf,\n    collections: collections::CollectionsState,",
              "    pub(super) indexing_settings: IndexingSettings,\n    settings_path: PathBuf,\n    face_embedding_settings: FaceEmbeddingSettings,\n    face_settings_path: PathBuf,\n    collections: collections::CollectionsState,",
              "ui fields",
          )
          text = replace_once(
              text,
              "        let settings_path = app_data_dir.join(\"performance-settings.ini\");\n        let indexing_settings = settings::load(&settings_path);\n        let embedding_service = EmbeddingService::new(model_cache);",
              "        let settings_path = app_data_dir.join(\"performance-settings.ini\");\n        let indexing_settings = settings::load(&settings_path);\n        let face_settings_path = app_data_dir.join(\"face-embedding-settings.ini\");\n        let face_embedding_settings = face_settings::load(&face_settings_path);\n        let embedding_service = EmbeddingService::new(model_cache);",
              "settings load",
          )
          text = replace_once(
              text,
              "            indexing_settings,\n            settings_path,\n            collections: collections::CollectionsState::default(),",
              "            indexing_settings,\n            settings_path,\n            face_embedding_settings,\n            face_settings_path,\n            collections: collections::CollectionsState::default(),",
              "self init",
          )
          text = replace_once(
              text,
              "        let mut clear_cache = false;\n        let mut save_performance_settings = false;",
              "        let mut clear_cache = false;\n        let mut save_performance_settings = false;\n        let mut save_face_settings = false;",
              "settings flags",
          )
          performance_tail = '''                if self.busy {
                    ui.small("Performance controls are locked while a worker operation is active.");
                }

                ui.add_space(12.0);
                ui.separator();
                ui.heading("Thumbnail cache");'''
          face_section = '''                if self.busy {
                    ui.small("Performance controls are locked while a worker operation is active.");
                }

                ui.add_space(12.0);
                ui.separator();
                ui.heading("Face identity (SFace)");
                ui.label("Use an external SFace-compatible ONNX model for portable face embeddings. Model weights are never downloaded or stored by the application.");
                ui.add_enabled_ui(!self.busy, |ui| {
                    ui.horizontal(|ui| {
                        let mut model_path = self
                            .face_embedding_settings
                            .model_path
                            .to_string_lossy()
                            .into_owned();
                        if ui
                            .add(
                                egui::TextEdit::singleline(&mut model_path)
                                    .hint_text("Path to external SFace .onnx")
                                    .desired_width(560.0),
                            )
                            .changed()
                        {
                            self.face_embedding_settings.model_path =
                                PathBuf::from(model_path.trim());
                            save_face_settings = true;
                        }
                        if ui.button("Browse…").clicked() {
                            if let Some(path) = rfd::FileDialog::new()
                                .add_filter("ONNX model", &["onnx"])
                                .pick_file()
                            {
                                self.face_embedding_settings.model_path = path;
                                save_face_settings = true;
                            }
                        }
                    });
                    let provider_before = self.face_embedding_settings.provider;
                    egui::ComboBox::from_label("SFace execution provider")
                        .selected_text(self.face_embedding_settings.provider_label())
                        .show_ui(ui, |ui| {
                            ui.selectable_value(
                                &mut self.face_embedding_settings.provider,
                                SFaceExecutionProvider::Cpu,
                                "CPU",
                            );
                            ui.selectable_value(
                                &mut self.face_embedding_settings.provider,
                                SFaceExecutionProvider::DirectMl,
                                "DirectML (Windows GPU)",
                            );
                        });
                    if provider_before != self.face_embedding_settings.provider {
                        save_face_settings = true;
                    }
                });
                if !self.face_embedding_settings.configured() {
                    ui.small("No SFace model configured. Face embedding remains disabled until an external ONNX path is selected.");
                } else if self.face_embedding_settings.model_path.is_file() {
                    ui.small(format!(
                        "Configured: {} on {}",
                        self.face_embedding_settings.model_path.display(),
                        self.face_embedding_settings.provider_label()
                    ));
                } else {
                    ui.colored_label(
                        egui::Color32::LIGHT_RED,
                        "Configured SFace model path is not currently available.",
                    );
                }

                ui.add_space(12.0);
                ui.separator();
                ui.heading("Thumbnail cache");'''
          text = replace_once(text, performance_tail, face_section, "face settings UI")

          marker = "\n    fn show_search_sidebar"
          pos = text.find(marker)
          if pos < 0:
              raise SystemExit("Missing show_search_sidebar marker")
          save_block = '''        if save_face_settings {
            match face_settings::save(&self.face_settings_path, &self.face_embedding_settings) {
                Ok(()) => {
                    self.status = if self.face_embedding_settings.configured() {
                        format!(
                            "SFace settings saved: {} on {}",
                            self.face_embedding_settings.model_path.display(),
                            self.face_embedding_settings.provider_label()
                        )
                    } else {
                        "SFace settings cleared".to_owned()
                    };
                }
                Err(err) => {
                    self.last_error = Some(format!("Cannot save SFace settings: {err:#}"));
                }
            }
        }
'''
          if save_block not in text:
              closing = text.rfind("    }\n", 0, pos)
              if closing < 0:
                  raise SystemExit("Cannot locate settings function closing brace")
              text = text[:closing] + save_block + text[closing:]
          ui.write_text(text, encoding="utf-8")

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format and commit integration wiring
        shell: pwsh
        run: |
          cargo fmt --all
          $changes = git status --porcelain
          if ($changes) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/main.rs src/ui/mod.rs src/face_settings.rs src/face_sface_production.rs
            git commit -m "feat: wire SFace production settings and embedder"
            git push origin HEAD:feat/sface-production-integration
          }

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Resolve application version
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $match) { throw "Cannot resolve package version from Cargo.toml" }
          $version = $match.Matches[0].Groups[1].Value
          $artifact = "windows-image-search-v$version-win64"
          "version=$version" >> $env:GITHUB_OUTPUT
          "artifact=$artifact" >> $env:GITHUB_OUTPUT
          Write-Host "Application version: $version"
          Write-Host "Artifact: $artifact"

      - name: PowerShell benchmark runner syntax
        shell: pwsh
        run: |
          $scriptPaths = @(
            "scripts\run-v0.2-benchmark-gate.ps1",
            "scripts\new-material-eval-manifest-from-folders.ps1",
            "scripts\run-v0.2-benchmark-gate-from-folders.ps1"
          )
          foreach ($relativePath in $scriptPaths) {
            $tokens = $null
            $errors = $null
            $scriptPath = (Resolve-Path $relativePath).Path
            [System.Management.Automation.Language.Parser]::ParseFile(
              $scriptPath,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host $_ -ForegroundColor Red }
              throw "PowerShell syntax errors in $relativePath"
            }
          }

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Cargo check
        run: cargo check --all-targets

      - name: Future-incompatible lint check
        env:
          RUSTFLAGS: -Dfuture-incompatible
        run: cargo check --all-targets

      - name: Regression tests
        run: cargo test --all-targets

      - name: Build release
        run: cargo build --release

      - name: Package Windows build
        shell: pwsh
        run: |
          $artifact = "${{ steps.version.outputs.artifact }}"
          $version = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\windows-image-search.exe dist\windows-image-search.exe
          Copy-Item target\release\portable-cache-repair.exe dist\portable-cache-repair.exe
          Get-ChildItem target\release -File -Filter *.dll -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName (Join-Path dist $_.Name) }
          Copy-Item scripts\run-v0.2-benchmark-gate.ps1 dist\run-v0.2-benchmark-gate.ps1
          Copy-Item scripts\new-material-eval-manifest-from-folders.ps1 dist\new-material-eval-manifest-from-folders.ps1
          Copy-Item scripts\run-v0.2-benchmark-gate-from-folders.ps1 dist\run-v0.2-benchmark-gate-from-folders.ps1
          Copy-Item README.md dist\README.md
          Copy-Item LICENSE dist\LICENSE
          Set-Content -Path dist\VERSION.txt -Value "v$version" -Encoding ascii
          Compress-Archive -Path dist\* -DestinationPath "$artifact.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: ${{ steps.version.outputs.artifact }}.zip
          if-no-files-found: error
          retention-days: 30
