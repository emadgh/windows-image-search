name: Apply oversized-file Settings integration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/oversized-source-file-limit
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Adapt size-limit control to current Preferences UI
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path('src/ui/settings_window.rs')
          text = path.read_text(encoding='utf-8')

          old = '"Detected {logical_threads} logical CPU thread{}. Safe defaults: Decode 2 / CLIP up to 4 / Batch 16 / Device CPU.",'
          new = '"Detected {logical_threads} logical CPU thread{}. Safe defaults: Decode 2 / CLIP up to 4 / Batch 16 / Device CPU / Max file 256 MiB.",'
          assert old in text
          text = text.replace(old, new, 1)

          old = '''        let batch_changed = ui
            .add(
                egui::Slider::new(
                    &mut app.indexing_settings.batch_size,
                    1..=settings::MAX_BATCH_SIZE,
                )
                .text("Index / embedding batch size"),
            )
            .changed();

        if decode_changed || clip_changed || batch_changed {
'''
          new = '''        let batch_changed = ui
            .add(
                egui::Slider::new(
                    &mut app.indexing_settings.batch_size,
                    1..=settings::MAX_BATCH_SIZE,
                )
                .text("Index / embedding batch size"),
            )
            .changed();
        let max_file_size_changed = ui
            .add(
                egui::Slider::new(
                    &mut app.indexing_settings.max_file_size_mib,
                    1..=settings::MAX_FILE_SIZE_MIB,
                )
                .logarithmic(true)
                .text("Maximum source file size (MiB)"),
            )
            .changed();
        ui.small(format!(
            "Files larger than {} MiB are skipped before decode, metadata extraction and CLIP, regardless of extension.",
            app.indexing_settings.max_file_size_mib
        ));

        if decode_changed || clip_changed || batch_changed || max_file_size_changed {
'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''                    "Performance settings saved: decode {}, CLIP {} threads on {}, batch {}",
                    app.indexing_settings.decode_workers,
                    app.indexing_settings.clip_threads,
                    app.indexing_settings.clip_execution_provider.label(),
                    app.indexing_settings.batch_size
'''
          new = '''                    "Performance settings saved: decode {}, CLIP {} threads on {}, batch {}, max source {} MiB",
                    app.indexing_settings.decode_workers,
                    app.indexing_settings.clip_threads,
                    app.indexing_settings.clip_execution_provider.label(),
                    app.indexing_settings.batch_size,
                    app.indexing_settings.max_file_size_mib
'''
          assert old in text
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          '@ | python -
      - name: Format and validate
        shell: pwsh
        run: |
          cargo fmt --all
          cargo check --all-targets
          cargo test --all-targets
      - name: Restore normal CI and commit integration
        shell: pwsh
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/windows-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/settings_window.rs .github/workflows/windows-build.yml
          git commit -m "fix: expose source file limit in Preferences"
          git push origin HEAD:fix/oversized-source-file-limit
