name: Windows build

on:
  push:
    branches:
      - main
      - feat/v0.1.0-mvp
      - fix/scan-thumbnail-and-decode-failures
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply scan indexing fixes
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/scan-thumbnail-and-decode-failures'
        shell: pwsh
        run: |
          python scripts/apply-scan-indexing-fixes.py
          cargo fmt --all
          if (git status --porcelain) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/indexer.rs src/db/mod.rs
            git commit -m "Fix scan thumbnail reuse and decode failure retries"
            git push
          }
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: PowerShell benchmark script syntax
        shell: pwsh
        run: |
          $files = @(
            'scripts/new-material-eval-manifest-from-folders.ps1',
            'scripts/run-v0.2-benchmark-gate-from-folders.ps1',
            'scripts/run-v0.2-benchmark-gate.ps1',
            'scripts/run-v0.3-face-benchmark-gate.ps1',
            'scripts/run-indexed-sample-benchmark.ps1',
            'scripts/run-oversized-source-validation.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $file).Path,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              exit 1
            }
          }
      - name: Windows PowerShell 5.1 benchmark compatibility
        shell: powershell
        run: |
          $files = @(
            'scripts/run-v0.2-benchmark-gate.ps1',
            'scripts/run-v0.3-face-benchmark-gate.ps1',
            'scripts/run-indexed-sample-benchmark.ps1',
            'scripts/run-oversized-source-validation.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $file).Path,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              exit 1
            }
          }
          foreach ($file in @(
            'scripts/run-v0.2-benchmark-gate.ps1',
            'scripts/run-v0.3-face-benchmark-gate.ps1',
            'scripts/run-oversized-source-validation.ps1'
          )) {
            if (Select-String -Path $file -Pattern '^\s*\$[A-Za-z_][A-Za-z0-9_]*\.ArgumentList\b' -Quiet) {
              throw "$file uses ProcessStartInfo.ArgumentList, which is unavailable on Windows PowerShell 5.1."
            }
          }
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Cargo check
        run: cargo check --all-targets
      - name: Tests
        run: cargo test --all-targets
      - name: Release build
        run: cargo build --release
      - name: Prepare Windows test bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item target/release/windows-image-search.exe artifact/
          Copy-Item scripts/run-indexed-sample-benchmark.ps1 artifact/
          Copy-Item scripts/run-v0.2-benchmark-gate.ps1 artifact/
          Copy-Item scripts/run-v0.3-face-benchmark-gate.ps1 artifact/
          Copy-Item scripts/run-oversized-source-validation.ps1 artifact/
          Copy-Item README.md artifact/
          Copy-Item LICENSE artifact/
          git rev-parse HEAD | Set-Content artifact/COMMIT.txt -Encoding ascii
      - name: Upload Windows test bundle
        uses: actions/upload-artifact@v4
        with:
          name: windows-image-search-pr133-test
          path: artifact
          if-no-files-found: error
          retention-days: 14
