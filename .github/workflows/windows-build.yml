name: Windows build

on:
  push:
    branches:
      - main
      - feat/v0.1.0-mvp
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/indexed-face-search-ui-v2

      - name: Wire indexed face search UI
        shell: python
        run: |
          from pathlib import Path

          def once(text, old, new, label):
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f"Missing patch anchor: {label}")
              return text.replace(old, new, 1)

          main = Path("src/main.rs")
          text = main.read_text(encoding="utf-8")
          text = once(
              text,
              "mod face_scope;\nmod face_settings;",
              "mod face_scope;\nmod face_search;\nmod face_settings;",
              "main face_search module",
          )
          main.write_text(text, encoding="utf-8")

          ui = Path("src/ui/mod.rs")
          text = ui.read_text(encoding="utf-8")
          text = once(
              text,
              "use crate::embedding::EmbeddingService;\nuse crate::face_settings::{self, FaceEmbeddingSettings};",
              "use crate::embedding::EmbeddingService;\nuse crate::face_search::{self, IndexedFaceChoice, IndexedFaceSearchOptions};\nuse crate::face_settings::{self, FaceEmbeddingSettings};",
              "face search imports",
          )
          text = once(
              text,
              "    pub(super) similarity_results: Option<Vec<ImageSummary>>,\n    pub(super) query_image: Option<PathBuf>,",
              "    pub(super) similarity_results: Option<Vec<ImageSummary>>,\n    face_results: Option<Vec<ImageSummary>>,\n    face_query_image: Option<PathBuf>,\n    face_query_faces: Vec<IndexedFaceChoice>,\n    face_query_face_id: Option<String>,\n    face_search_options: IndexedFaceSearchOptions,\n    pub(super) query_image: Option<PathBuf>,",
              "face search fields",
          )
          text = once(
              text,
              "            similarity_results: None,\n            query_image: None,",
              "            similarity_results: None,\n            face_results: None,\n            face_query_image: None,\n            face_query_faces: Vec::new(),\n            face_query_face_id: None,\n            face_search_options: IndexedFaceSearchOptions::default(),\n            query_image: None,",
              "face search initialization",
          )
          text = once(
              text,
              "        if let Some(results) = &mut self.similarity_results {\n            results.retain(|record| !removed.contains(&record.path));\n        }",
              "        if let Some(results) = &mut self.similarity_results {\n            results.retain(|record| !removed.contains(&record.path));\n        }\n        if let Some(results) = &mut self.face_results {\n            results.retain(|record| !removed.contains(&record.path));\n        }\n        if self.face_query_image.as_ref().is_some_and(|path| removed.contains(path)) {\n            self.clear_face_search_state();\n        }",
              "removed face results",
          )
          text = once(
              text,
              "        let mut protected = HashSet::new();\n        if let Some(query) = &self.query_image {",
              "        let mut protected = HashSet::new();\n        if let Some(query) = &self.face_query_image {\n            if self.textures.contains_key(query) {\n                protected.insert(query.clone());\n            }\n        }\n        if let Some(query) = &self.query_image {",
              "face query texture protection",
          )

          # Any index mutation invalidates the transient face-search view.
          text = text.replace(
              "        self.similarity_results = None;\n        self.selected_paths.clear();",
              "        self.similarity_results = None;\n        self.clear_face_search_state();\n        self.selected_paths.clear();",
          )
          text = once(
              text,
              "                self.similarity_results = None;\n                self.selected_paths.clear();",
              "                self.similarity_results = None;\n                self.clear_face_search_state();\n                self.selected_paths.clear();",
              "remove folder clears face search",
          )
          text = once(
              text,
              "        self.searching = true;\n        self.busy = true;\n        self.last_error = None;\n        self.query_image = Some(path.clone());",
              "        self.searching = true;\n        self.busy = true;\n        self.last_error = None;\n        self.clear_face_search_state();\n        self.query_image = Some(path.clone());",
              "image search clears face search",
          )

          source_marker = "    pub(super) fn source(&self) -> &[ImageSummary] {"
          methods = '''    fn clear_face_search_state(&mut self) {
        self.face_results = None;
        self.face_query_image = None;
        self.face_query_faces.clear();
        self.face_query_face_id = None;
    }

    fn load_face_query_from_selected(&mut self) {
        if self.selected_paths.len() != 1 {
            self.last_error = Some("Select exactly one indexed image to choose a face.".to_owned());
            return;
        }
        let path = self.selected_paths.iter().next().cloned().unwrap();
        let Some(root) = portable::indexed_root_for_path(&path, &self.roots).cloned() else {
            self.last_error = Some("Selected image is not inside an available indexed root.".to_owned());
            return;
        };
        match face_search::list_persisted_faces(&root, &path) {
            Ok(faces) if faces.is_empty() => {
                self.clear_face_search_state();
                self.last_error = Some(
                    "No current persisted faces are available for the selected image.".to_owned(),
                );
            }
            Ok(faces) => {
                self.face_results = None;
                self.similarity_results = None;
                self.query_image = None;
                self.face_query_image = Some(path);
                self.face_query_face_id = if faces.len() == 1 {
                    Some(faces[0].face_id.clone())
                } else {
                    None
                };
                self.face_query_faces = faces;
                self.last_error = None;
                self.status = format!(
                    "Face query ready: {} detected face{}",
                    self.face_query_faces.len(),
                    if self.face_query_faces.len() == 1 { "" } else { "s" }
                );
            }
            Err(err) => {
                self.last_error = Some(format!("Cannot load indexed faces: {err:#}"));
            }
        }
    }

    fn run_indexed_face_search(&mut self, face_id: &str) {
        let Some(query_path) = self.face_query_image.clone() else {
            self.last_error = Some("Choose an indexed face query first.".to_owned());
            return;
        };
        let Some(query_root) = portable::indexed_root_for_path(&query_path, &self.roots).cloned()
        else {
            self.last_error = Some("Face query root is unavailable.".to_owned());
            return;
        };
        self.face_search_options = self.face_search_options.sanitized();
        match face_search::search_indexed_face(
            &self.roots,
            &query_root,
            face_id,
            self.face_search_options,
        ) {
            Ok(report) => {
                let mut results = Vec::new();
                for hit in report.matches {
                    if hit.image_path == query_path {
                        continue;
                    }
                    let Some(&index) = self.image_positions.get(&hit.image_path) else {
                        continue;
                    };
                    let mut record = self.images[index].clone();
                    record.score = Some(hit.similarity);
                    results.push(record);
                }
                self.similarity_results = None;
                self.query_image = None;
                self.face_query_face_id = Some(face_id.to_owned());
                self.face_results = Some(results);
                self.selected_paths.clear();
                self.last_error = None;
                let count = self.face_results.as_ref().map_or(0, Vec::len);
                self.status = format!(
                    "Face search: {count} result{} across {} root{}; {} unavailable",
                    if count == 1 { "" } else { "s" },
                    report.roots_searched,
                    if report.roots_searched == 1 { "" } else { "s" },
                    report.roots_unavailable
                );
            }
            Err(err) => self.last_error = Some(format!("Face search failed: {err:#}")),
        }
    }

'''
          if methods not in text:
              if source_marker not in text:
                  raise SystemExit("Missing source marker")
              text = text.replace(source_marker, methods + source_marker, 1)
          text = once(
              text,
              "    pub(super) fn source(&self) -> &[ImageSummary] {\n        self.similarity_results.as_deref().unwrap_or(&self.images)\n    }",
              "    pub(super) fn source(&self) -> &[ImageSummary] {\n        self.face_results\n            .as_deref()\n            .or_else(|| self.similarity_results.as_deref())\n            .unwrap_or(&self.images)\n    }",
              "face result source",
          )

          query_block = '''                    if let Some(query) = self.query_image.clone() {
                        ui.add_space(8.0);
                        ui.strong("Similarity query");
                        if let Some(texture) = self.thumbnail(&query) {
                            views::show_query_preview(ui, &texture, 220.0);
                        } else {
                            ui.add_sized([220.0, 150.0], egui::Label::new("Loading preview…"));
                        }
                        ui.small(views::truncate_middle(&query.display().to_string(), 46))
                            .on_hover_text(query.display().to_string());
                    }

                    ui.add_space(10.0);
                    ui.separator();
                    ui.strong("Color filter");'''
          face_ui = '''                    if let Some(query) = self.query_image.clone() {
                        ui.add_space(8.0);
                        ui.strong("Similarity query");
                        if let Some(texture) = self.thumbnail(&query) {
                            views::show_query_preview(ui, &texture, 220.0);
                        } else {
                            ui.add_sized([220.0, 150.0], egui::Label::new("Loading preview…"));
                        }
                        ui.small(views::truncate_middle(&query.display().to_string(), 46))
                            .on_hover_text(query.display().to_string());
                    }

                    ui.add_space(10.0);
                    ui.separator();
                    ui.strong("Face search");
                    ui.small("Select one indexed image, then choose one of its persisted faces.");
                    if ui
                        .add_enabled(
                            self.selected_paths.len() == 1 && !self.busy,
                            egui::Button::new("Use selected image"),
                        )
                        .clicked()
                    {
                        self.load_face_query_from_selected();
                    }
                    if let Some(query) = self.face_query_image.clone() {
                        ui.small(views::truncate_middle(&query.display().to_string(), 46))
                            .on_hover_text(query.display().to_string());
                        let choices = self.face_query_faces.clone();
                        for face in choices {
                            let selected = self.face_query_face_id.as_deref()
                                == Some(face.face_id.as_str());
                            if ui
                                .selectable_label(
                                    selected,
                                    format!(
                                        "Face {} · {:.0}% confidence",
                                        face.ordinal + 1,
                                        face.confidence * 100.0
                                    ),
                                )
                                .clicked()
                            {
                                self.face_query_face_id = Some(face.face_id.clone());
                            }
                            if selected {
                                ui.small(format!(
                                    "box x {:.2} y {:.2} w {:.2} h {:.2} · {} landmarks",
                                    face.bbox.x,
                                    face.bbox.y,
                                    face.bbox.width,
                                    face.bbox.height,
                                    face.landmarks.len()
                                ));
                            }
                        }
                        ui.add(
                            egui::Slider::new(
                                &mut self.face_search_options.min_similarity,
                                0.0..=1.0,
                            )
                            .text("Min similarity"),
                        );
                        ui.add(
                            egui::Slider::new(&mut self.face_search_options.limit, 1..=500)
                                .text("Top-K"),
                        );
                        let chosen = self.face_query_face_id.clone();
                        if ui
                            .add_enabled(
                                chosen.is_some() && !self.busy,
                                egui::Button::new("Search selected face"),
                            )
                            .clicked()
                        {
                            if let Some(face_id) = chosen {
                                self.run_indexed_face_search(&face_id);
                            }
                        }
                    }
                    if (self.face_results.is_some() || self.face_query_image.is_some())
                        && ui.button("Clear face search").clicked()
                    {
                        self.clear_face_search_state();
                        self.selected_paths.clear();
                    }

                    ui.add_space(10.0);
                    ui.separator();
                    ui.strong("Color filter");'''
          text = once(text, query_block, face_ui, "face search sidebar")
          text = once(
              text,
              "                if self.similarity_results.is_some() {\n                    ui.small(\"Hybrid similarity order using current weights\");\n                }",
              "                if self.face_results.is_some() {\n                    ui.small(\"Face identity order; score is best matching-face similarity\");\n                } else if self.similarity_results.is_some() {\n                    ui.small(\"Hybrid similarity order using current weights\");\n                }",
              "face result label",
          )
          ui.write_text(text, encoding="utf-8")

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format and commit face-search wiring
        shell: pwsh
        run: |
          cargo fmt --all
          $changes = git status --porcelain
          if ($changes) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/main.rs src/ui/mod.rs src/face_search.rs
            git commit -m "feat: wire indexed face chooser and search UI"
            git push origin HEAD:feat/indexed-face-search-ui-v2
          }

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Resolve application version
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $match) { throw "Cannot resolve package version from Cargo.toml" }
          $version = $match.Matches[0].Groups[1].Value
          $artifact = "windows-image-search-v$version-win64"
          "version=$version" >> $env:GITHUB_OUTPUT
          "artifact=$artifact" >> $env:GITHUB_OUTPUT
          Write-Host "Application version: $version"
          Write-Host "Artifact: $artifact"

      - name: PowerShell benchmark runner syntax
        shell: pwsh
        run: |
          $scriptPaths = @(
            "scripts\run-v0.2-benchmark-gate.ps1",
            "scripts\new-material-eval-manifest-from-folders.ps1",
            "scripts\run-v0.2-benchmark-gate-from-folders.ps1"
          )
          foreach ($relativePath in $scriptPaths) {
            $tokens = $null
            $errors = $null
            $scriptPath = (Resolve-Path $relativePath).Path
            [System.Management.Automation.Language.Parser]::ParseFile(
              $scriptPath,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host $_ -ForegroundColor Red }
              throw "PowerShell syntax errors in $relativePath"
            }
          }

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Cargo check
        run: cargo check --all-targets

      - name: Future-incompatible lint check
        env:
          RUSTFLAGS: -Dfuture-incompatible
        run: cargo check --all-targets

      - name: Regression tests
        run: cargo test --all-targets

      - name: Build release
        run: cargo build --release

      - name: Package Windows build
        shell: pwsh
        run: |
          $artifact = "${{ steps.version.outputs.artifact }}"
          $version = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\windows-image-search.exe dist\windows-image-search.exe
          Copy-Item target\release\portable-cache-repair.exe dist\portable-cache-repair.exe
          Get-ChildItem target\release -File -Filter *.dll -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName (Join-Path dist $_.Name) }
          Copy-Item scripts\run-v0.2-benchmark-gate.ps1 dist\run-v0.2-benchmark-gate.ps1
          Copy-Item scripts\new-material-eval-manifest-from-folders.ps1 dist\new-material-eval-manifest-from-folders.ps1
          Copy-Item scripts\run-v0.2-benchmark-gate-from-folders.ps1 dist\run-v0.2-benchmark-gate-from-folders.ps1
          Copy-Item README.md dist\README.md
          Copy-Item LICENSE dist\LICENSE
          Set-Content -Path dist\VERSION.txt -Value "v$version" -Encoding ascii
          Compress-Archive -Path dist\* -DestinationPath "$artifact.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: ${{ steps.version.outputs.artifact }}.zip
          if-no-files-found: error
          retention-days: 30
