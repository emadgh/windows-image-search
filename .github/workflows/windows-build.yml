name: Windows build

on:
  push:
    branches:
      - main
      - feat/v0.1.0-mvp
      - feat/collections-management
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Apply Collections implementation
        run: python scripts/apply_collections.py

      - name: Format source
        run: cargo fmt --all

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Cargo check
        run: cargo check --all-targets

      - name: Regression tests
        run: cargo test --all-targets

      - name: Stage validated source artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path validated-source\src\ui | Out-Null
          Copy-Item src\db.rs validated-source\src\db.rs
          Copy-Item src\ui\mod.rs validated-source\src\ui\mod.rs
          Copy-Item src\ui\views.rs validated-source\src\ui\views.rs
          Copy-Item src\ui\collections.rs validated-source\src\ui\collections.rs

      - name: Upload validated source
        uses: actions/upload-artifact@v4
        with:
          name: collections-validated-source
          path: validated-source
          if-no-files-found: error
          retention-days: 7

      - name: Build release
        run: cargo build --release

      - name: Package Windows build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\windows-image-search.exe dist\windows-image-search.exe
          Get-ChildItem target\release -Recurse -Filter *.dll -ErrorAction SilentlyContinue |
            ForEach-Object {
              $dest = Join-Path dist $_.Name
              if (-not (Test-Path $dest)) { Copy-Item $_.FullName $dest }
            }
          Copy-Item README.md dist\README.md
          Copy-Item LICENSE dist\LICENSE
          Compress-Archive -Path dist\* -DestinationPath windows-image-search-win64.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-image-search-win64
          path: windows-image-search-win64.zip
          if-no-files-found: error
          retention-days: 30
