name: Windows build

on:
  push:
    branches:
      - main
      - feat/v0.1.0-mvp
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Cargo check
        run: cargo check --all-targets
      - name: Tests
        run: cargo test --all-targets
      - name: Release build
        run: cargo build --release
