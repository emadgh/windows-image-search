name: Windows build

on:
  push:
    branches:
      - main
      - feat/v0.1.0-mvp
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply one-time portable repair compile patch
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 117
        shell: pwsh
        run: |
          $path = "src/bin/portable-cache-repair.rs"
          $text = [System.IO.File]::ReadAllText($path)
          $old = @'
    let mut loader = HnswIo::new(&ann_dir, &manifest.basename);
    match loader.load_hnsw::<f32, DistCosine>() {
        Ok(_) => Ok(AnnState::Current),
        Err(_) => Ok(AnnState::Corrupt),
    }
'@
          $new = @'
    let mut loader = HnswIo::new(&ann_dir, &manifest.basename);
    let state = match loader.load_hnsw::<f32, DistCosine>() {
        Ok(_) => AnnState::Current,
        Err(_) => AnnState::Corrupt,
    };
    Ok(state)
'@
          if (-not $text.Contains($old)) { throw "Expected HNSW loader block not found" }
          [System.IO.File]::WriteAllText($path, $text.Replace($old, $new), [System.Text.UTF8Encoding]::new($false))
          Copy-Item .github/windows-build.final.yml .github/workflows/windows-build.yml -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $path .github/workflows/windows-build.yml
          git rm .github/windows-build.final.yml
          if (Test-Path .github/workflows/self-patch-portable.yml) { git rm .github/workflows/self-patch-portable.yml }
          git commit -m "fix: avoid borrowed HNSW loader temporary"
          git push origin HEAD:${{ github.head_ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Resolve application version
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $match) { throw "Cannot resolve package version from Cargo.toml" }
          $version = $match.Matches[0].Groups[1].Value
          $artifact = "windows-image-search-v$version-win64"
          "version=$version" >> $env:GITHUB_OUTPUT
          "artifact=$artifact" >> $env:GITHUB_OUTPUT
          Write-Host "Application version: $version"
          Write-Host "Artifact: $artifact"

      - name: PowerShell benchmark runner syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $scriptPath = (Resolve-Path "scripts\run-v0.2-benchmark-gate.ps1").Path
          [System.Management.Automation.Language.Parser]::ParseFile(
            $scriptPath,
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_ -ForegroundColor Red }
            throw "Benchmark gate runner has PowerShell syntax errors"
          }

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Cargo check
        run: cargo check --all-targets

      - name: Future-incompatible lint check
        env:
          RUSTFLAGS: -Dfuture-incompatible
        run: cargo check --all-targets

      - name: Regression tests
        run: cargo test --all-targets

      - name: Build release
        run: cargo build --release

      - name: Package Windows build
        shell: pwsh
        run: |
          $artifact = "${{ steps.version.outputs.artifact }}"
          $version = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\windows-image-search.exe dist\windows-image-search.exe
          Copy-Item target\release\portable-cache-repair.exe dist\portable-cache-repair.exe
          Get-ChildItem target\release -File -Filter *.dll -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName (Join-Path dist $_.Name) }
          Copy-Item scripts\run-v0.2-benchmark-gate.ps1 dist\run-v0.2-benchmark-gate.ps1
          Copy-Item README.md dist\README.md
          Copy-Item LICENSE dist\LICENSE
          Set-Content -Path dist\VERSION.txt -Value "v$version" -Encoding ascii
          Compress-Archive -Path dist\* -DestinationPath "$artifact.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: ${{ steps.version.outputs.artifact }}.zip
          if-no-files-found: error
          retention-days: 30
