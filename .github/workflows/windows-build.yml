name: Windows build

on:
  push:
    branches:
      - main
      - feat/v0.1.0-mvp
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Apply indexing performance implementation
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/indexing-performance-settings'
        shell: pwsh
        run: |
          $workflow = Get-Content .github/workflows/apply-indexing-performance-settings.yml -Raw
          $match = [regex]::Match($workflow, "(?s)@'\r?\n(.*?)\r?\n\s*'@ \| Set-Content -Encoding UTF8 patch_settings.py")
          if (-not $match.Success) { throw "Could not extract patch script from helper workflow" }
          $lines = $match.Groups[1].Value -split "`r?`n"
          $python = ($lines | ForEach-Object { $_ -replace '^          ', '' }) -join "`n"
          $python = $python.Replace("if count != 1:", "if count < 1:")
          $python | Set-Content -Encoding UTF8 patch_settings.py
          python patch_settings.py
          Remove-Item patch_settings.py

      - name: Format check
        run: |
          cargo fmt --all
          cargo fmt --all -- --check

      - name: Cargo check
        run: cargo check --all-targets

      - name: Regression tests
        run: cargo test --all-targets

      - name: Commit implementation and restore standard CI
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/indexing-performance-settings'
        shell: pwsh
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/windows-build.yml
          Remove-Item .github/workflows/apply-indexing-performance-settings.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.rs src/settings.rs src/indexer.rs src/ui/mod.rs .github/workflows/windows-build.yml .github/workflows/apply-indexing-performance-settings.yml
          git commit -m "feat: add persistent indexing performance controls"
          git push origin HEAD:${{ github.head_ref }}

      - name: Build release
        run: cargo build --release

      - name: Package Windows build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\windows-image-search.exe dist\windows-image-search.exe
          Get-ChildItem target\release -Recurse -Filter *.dll -ErrorAction SilentlyContinue |
            ForEach-Object {
              $dest = Join-Path dist $_.Name
              if (-not (Test-Path $dest)) { Copy-Item $_.FullName $dest }
            }
          Copy-Item README.md dist\README.md
          Copy-Item LICENSE dist\LICENSE
          Compress-Archive -Path dist\* -DestinationPath windows-image-search-win64.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-image-search-win64
          path: windows-image-search-win64.zip
          if-no-files-found: error
          retention-days: 30
