name: Vendor face models

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/vendor-face-models.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Vendor models and patch runtime
        shell: bash
        run: |
          set -euo pipefail
          # OpenCV Zoo stores these ONNX files in Git LFS. The normal raw URL
          # returns only the pointer, while media.githubusercontent.com serves
          # the actual LFS object bytes.
          sed -i 's#https://raw.githubusercontent.com/opencv/opencv_zoo/main/#https://media.githubusercontent.com/media/opencv/opencv_zoo/main/#g' scripts/vendor-face-models.py
          python3 scripts/vendor-face-models.py

      - name: Format Rust changes
        run: cargo fmt --all

      - name: Verify vendored model hashes
        shell: bash
        run: |
          set -euo pipefail
          echo "ebafce4e3c118d6554634be5c27ab333b4c047a9a8c3faf1d7cf93101c22f0f0  models/faces/face_detection_yunet_2026may.onnx" | sha256sum -c -
          echo "0ba9fbfa01b5270c96627c4ef784da859931e02f04419c829e83484087c34e79  models/faces/face_recognition_sface_2021dec.onnx" | sha256sum -c -
          test "$(stat -c%s models/faces/face_detection_yunet_2026may.onnx)" = "229738"
          test "$(stat -c%s models/faces/face_recognition_sface_2021dec.onnx)" = "38696353"
          git diff --check

      - name: Commit models and automatic bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/faces src/face_model_manager.rs src/ui/face_runtime.rs src/ui/task_center.rs
          if git diff --cached --quiet; then
            echo "Face models and runtime bootstrap are already up to date."
            exit 0
          fi
          git commit -m "Vendor face models and auto-download before face scan"
          git push origin HEAD:main
