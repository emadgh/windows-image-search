name: Validate combined UI follow-ups

on:
  push:
    branches: [integration/ui-followups-combined]
    paths:
      - '.github/workflows/validate-ui-followups-combined.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/ui-followups-combined
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Merge result-order cache follow-up
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin perf/cache-visible-result-order
          git merge --no-ff --no-edit origin/perf/cache-visible-result-order || {
            echo 'Conflict while merging PR #215:'
            git diff --name-only --diff-filter=U
            exit 1
          }
      - name: Merge theme follow-up
        shell: bash
        run: |
          git fetch origin perf/apply-theme-on-change
          git merge --no-ff --no-edit origin/perf/apply-theme-on-change || {
            echo 'Conflict while merging PR #216:'
            git diff --name-only --diff-filter=U
            exit 1
          }
      - name: Merge updater follow-up
        shell: bash
        run: |
          git fetch origin feat/automatic-github-updates
          git merge --no-ff --no-edit origin/feat/automatic-github-updates || {
            echo 'Conflict while merging PR #196:'
            git diff --name-only --diff-filter=U
            exit 1
          }
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Cargo check
        run: cargo check --all-targets
      - name: Tests
        run: cargo test --all-targets
      - name: Release build
        run: cargo build --release
      - name: Save validated combined integration
        shell: bash
        run: |
          git rm .github/workflows/validate-ui-followups-combined.yml
          git commit -m 'chore: remove combined follow-up validation workflow'
          git push origin HEAD:integration/ui-followups-combined
