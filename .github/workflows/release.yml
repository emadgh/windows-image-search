name: Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  LIBVIPS_VERSION: 8.18.6

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install libvips runtime and import library
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'libvips.zip'
          $root = Join-Path $env:RUNNER_TEMP 'libvips'
          $url = "https://github.com/libvips/build-win64-mxe/releases/download/v$env:LIBVIPS_VERSION/vips-dev-x64-web-$env:LIBVIPS_VERSION.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $root -Force

          $importLibrary = Get-ChildItem -LiteralPath $root -Recurse -File -Filter 'libvips.lib' | Select-Object -First 1
          $runtimeDll = Get-ChildItem -LiteralPath $root -Recurse -File -Filter 'libvips-42.dll' | Select-Object -First 1
          if (-not $importLibrary) {
            throw 'libvips.lib was not found in the downloaded Windows bundle.'
          }
          if (-not $runtimeDll) {
            throw 'libvips-42.dll was not found in the downloaded Windows bundle.'
          }

          "VIPS_LIB_DIR=$($importLibrary.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VIPS_BIN_DIR=$($runtimeDll.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $runtimeDll.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Test release configuration
        run: cargo test --all-targets --locked --features libvips-backend
      - name: Build release
        run: cargo build --release --locked --features libvips-backend
      - name: Prepare updater bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/windows-image-search.exe dist/windows-image-search.exe
          Copy-Item "$env:VIPS_BIN_DIR\*.dll" dist/
          Copy-Item "docs/releases/${{ github.ref_name }}.md" dist/RELEASE-NOTES.md
          Copy-Item README.md, LICENSE dist/
          "${{ github.ref_name }}" | Set-Content -Encoding ascii dist/VERSION.txt
          git rev-parse HEAD | Set-Content -Encoding ascii dist/COMMIT.txt
          "libvips $env:LIBVIPS_VERSION" | Set-Content -Encoding ascii dist/LIBVIPS-VERSION.txt

          $bundle = 'windows-image-search-win64.zip'
          Compress-Archive -Path dist/* -DestinationPath $bundle
          $bundleHash = (Get-FileHash -Algorithm SHA256 $bundle).Hash.ToLowerInvariant()
          "$bundleHash  $bundle" | Set-Content -Encoding ascii -NoNewline "$bundle.sha256"

          $versionedBundle = "windows-image-search-${{ github.ref_name }}-win64.zip"
          Copy-Item $bundle $versionedBundle
          "$bundleHash  $versionedBundle" | Set-Content -Encoding ascii -NoNewline "$versionedBundle.sha256"

          if (-not (Test-Path 'dist/libvips-42.dll')) {
            throw 'Release bundle is missing libvips-42.dll.'
          }
          if (-not (Test-Path 'dist/windows-image-search.exe')) {
            throw 'Release bundle is missing windows-image-search.exe.'
          }
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          name: ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            windows-image-search-win64.zip
            windows-image-search-win64.zip.sha256
            windows-image-search-${{ github.ref_name }}-win64.zip
            windows-image-search-${{ github.ref_name }}-win64.zip.sha256
