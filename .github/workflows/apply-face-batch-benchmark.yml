name: Apply face batch benchmark sweep

on:
  push:
    branches: [perf/face-batch-benchmark-sweep]
    paths:
      - '.github/workflows/apply-face-batch-benchmark.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/face-batch-benchmark-sweep
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply robustness patch
        run: python scripts/fix-face-batch-benchmark-robustness.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Commit robustness fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/face_sface_benchmark.rs
          git commit -m 'fix(face): keep batch benchmark failures reportable'
          git push origin HEAD:perf/face-batch-benchmark-sweep
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Cargo check
        run: cargo check --all-targets
      - name: Tests
        run: cargo test --all-targets
      - name: Release build
        run: cargo build --release
