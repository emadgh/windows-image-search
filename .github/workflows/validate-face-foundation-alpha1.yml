name: Validate face foundation alpha1

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'feat/face-storage-foundation-v0.3-alpha1'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/face-storage-foundation-v0.3-alpha1
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Apply alpha1 integration
        run: python scripts/apply_face_foundation_alpha1.py

      - name: Format
        run: cargo fmt --all

      - name: Cargo check
        run: cargo check --all-targets

      - name: Future-incompatible warnings are errors
        shell: pwsh
        run: |
          $env:RUSTFLAGS = '-Dfuture-incompatible'
          cargo check --all-targets

      - name: Regression tests
        run: cargo test --all-targets

      - name: Commit validated source and lockfile
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock src\main.rs src\portable.rs src\face_detection.rs src\face_store.rs src\face_portable_tests.rs
          if (git status --porcelain -- Cargo.toml Cargo.lock src\main.rs src\portable.rs src\face_detection.rs src\face_store.rs src\face_portable_tests.rs) {
            git commit -m "feat: integrate v0.3 face storage foundation"
            git push origin HEAD:feat/face-storage-foundation-v0.3-alpha1
          }
