name: Apply UI review shortcut guard

on:
  push:
    branches: [feat/ui-ux-overhaul-phase-1]
    paths:
      - '.github/workflows/apply-ui-review-shortcut-guard.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ui-ux-overhaul-phase-1
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply shortcut guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          people = Path('src/ui/people_manager.rs')
          text = people.read_text(encoding='utf-8')
          old = '    open: bool,\n'
          new = '    pub(super) open: bool,\n'
          if old not in text:
              raise SystemExit('people manager open field target not found')
          people.write_text(text.replace(old, new, 1), encoding='utf-8')

          ux = Path('src/ui/ux.rs')
          text = ux.read_text(encoding='utf-8')
          old = '            || self.task_center_open\n            || self.close_confirmation_open\n'
          new = '            || self.task_center_open\n            || self.people_manager_ui.open\n            || self.close_confirmation_open\n'
          if old not in text:
              raise SystemExit('shortcut guard target not found')
          ux.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          cargo fmt --all
      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ui/people_manager.rs src/ui/ux.rs
          git commit -m 'fix(ui): block result shortcuts behind People Manager'
          git push origin HEAD:feat/ui-ux-overhaul-phase-1
