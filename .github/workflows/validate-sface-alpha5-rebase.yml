name: Validate rebased SFace alpha5

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'perf/face-model-adapters-v0.3-alpha5'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/face-model-adapters-v0.3-alpha5
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Apply integration
        run: python scripts/apply_sface_adapter_alpha5_rebase.py
      - name: Format
        run: cargo fmt --all
      - name: Cargo check
        run: cargo check --all-targets
      - name: Future-incompatible warnings are errors
        shell: pwsh
        run: |
          $env:RUSTFLAGS = '-Dfuture-incompatible'
          cargo check --all-targets
      - name: Regression tests
        run: cargo test --all-targets
      - name: Release build
        run: cargo build --release
      - name: Commit validated source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src\main.rs
          if (git status --porcelain -- src\main.rs) {
            git commit -m "perf: wire SFace benchmark on alpha5"
            git push origin HEAD:perf/face-model-adapters-v0.3-alpha5
          }
