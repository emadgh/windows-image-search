name: Rustfmt fix

on:
  push:
    branches: [fix/hybrid-image-similarity]
    paths:
      - .github/workflows/rustfmt-fix.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hybrid-image-similarity

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply rustfmt
        run: cargo fmt --all

      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "style: apply rustfmt"
          git push origin HEAD:fix/hybrid-image-similarity
