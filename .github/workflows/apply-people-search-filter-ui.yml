name: Apply People search filter UI

on:
  push:
    branches:
      - feat/people-search-filters

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/people-search-filters
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply UI wiring
        run: python scripts/wire_people_search_filter_ui.py
      - name: Format
        run: cargo fmt --all
      - name: Remove temporary wiring files
        run: |
          rm scripts/wire_people_search_filter_ui.py
          rm .github/workflows/apply-people-search-filter-ui.yml
          rm -f .github/workflows/wire-people-filter-core.yml
      - name: Commit wired source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/mod.rs src/ui/face_runtime.rs src/ui/people_manager.rs src/ui/people_filter.rs src/main.rs src/people_filter.rs scripts/wire_people_search_filter_ui.py .github/workflows/apply-people-search-filter-ui.yml .github/workflows/wire-people-filter-core.yml
          git commit -m "feat: wire People filters into search UI"
          git push origin HEAD:feat/people-search-filters
