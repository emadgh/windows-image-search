name: Apply People runtime and gallery integration

on:
  push:
    branches:
      - feat/people-clustering-foundation

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/people-clustering-foundation
          fetch-depth: 0
      - name: Apply source integration
        run: python scripts/integrate_people_runtime.py
      - name: Remove temporary patch machinery
        run: |
          rm scripts/integrate_people_runtime.py
          rm .github/workflows/apply-people-runtime.yml
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/face_runtime.rs src/face_search.rs src/ui/face_search_panel.rs scripts/integrate_people_runtime.py .github/workflows/apply-people-runtime.yml
          git commit -m "feat: integrate automatic People clustering and suggestions"
          git push origin HEAD:feat/people-clustering-foundation
