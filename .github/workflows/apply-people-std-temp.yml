name: Apply std-only People test temp dirs

on:
  push:
    branches:
      - feat/people-clustering-foundation

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/people-clustering-foundation
          fetch-depth: 0
      - name: Replace tempfile usage
        run: python scripts/remove_people_tempfile.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --all
      - name: Remove temporary patch machinery
        run: |
          rm scripts/remove_people_tempfile.py
          rm .github/workflows/apply-people-std-temp.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/people_clustering.rs scripts/remove_people_tempfile.py .github/workflows/apply-people-std-temp.yml
          git commit -m "test: use std temp directories for People regressions"
          git push origin HEAD:feat/people-clustering-foundation
