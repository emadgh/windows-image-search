[package]
name = "windows-image-search"
version = "0.4.3"
edition = "2021"
description = "Local image indexing and visual search for Windows"
license = "MIT"
repository = "https://github.com/emadgh/windows-image-search"
default-run = "windows-image-search"

[features]
default = []
libvips-backend = ["dep:rs-vips"]

[dependencies]
anyhow = "1"
arboard = "3.6.1"
chrono = { version = "0.4", default-features = true }
dirs = "6"
eframe = { version = "0.32", default-features = true }
egui = "0.32"
fastembed = { version = "5.17.4", features = ["directml"] }
hnsw_rs = "0.3.4"
image = { version = "0.25", features = ["jpeg", "png", "tiff"] }
jpeg-decoder = "0.3.2"
kamadak-exif = "0.6"
notify = "8.2"
open = "5"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["directml"] }
rayon = "1.10"
rfd = "0.15"
rs-vips = { version = "0.7", optional = true }
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
update-via-github = { git = "https://github.com/emadgh/update-via-github.git", rev = "ec648957782ab800e14ddc6e0a15c694a46f1252" }
ureq = "2.12"
walkdir = "2.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Console", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "=3.0.11"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[package.metadata.bundle]
name = "Windows Image Search"
identifier = "com.emadgh.windows-image-search"
