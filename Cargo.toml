[package]
name = "windows-image-search"
version = "0.3.0-alpha.6"
edition = "2021"

[dependencies]
anyhow = "1"
blake3 = "1"
chrono = "0.4"
eframe = "0.32"
egui = "0.32"
fast_image_resize = "5"
hnsw_rs = "0.3"
image = { version = "0.25", features = ["jpeg", "png", "tiff"] }
kamadak-exif = "0.6"
notify = "8.2"
open = "5"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["directml"] }
rayon = "1.10"
rfd = "0.15"
rusqlite = { version = "0.37", features = ["bundled"] }
walkdir = "2.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Console", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[package.metadata.bundle]
name = "Windows Image Search"
identifier = "com.emadgh.windows-image-search"
